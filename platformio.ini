; PlatformIO 项目配置
; 安装 VS Code + PlatformIO 插件后，打开此项目即可一键编译
; 比完整安装 ESP-IDF 更简单，PlatformIO 自动下载工具链

[env:esp32-c3-devkitm-1]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800

; 分区表
board_build.partitions = partitions.csv

; 编译选项
build_flags =
    -D CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y

; SPIFFS 配置
board_build.filesystem = spiffs
board_build.spiffs_size = 0x610000
board_build.spiffs_start = 0x1F0000

; SPIFFS 数据目录（放 book.txt）
spiffs_src_dir = spiffs_data
