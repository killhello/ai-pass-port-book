name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF (no Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

          git clone --depth 1 --branch v5.5.3 --recursive https://github.com/espressif/esp-idf.git $HOME/esp-idf
          $HOME/esp-idf/install.sh esp32c3

      - name: Build firmware
        run: |
          . $HOME/esp-idf/export.sh

          idf.py build

          test -f build/FoloToy-AI-Passport.bin || { echo "FAIL: firmware not found"; ls -la build/; exit 1; }
          ls -lh build/FoloToy-AI-Passport.bin

          python $IDF_PATH/components/spiffs/spiffsgen.py 0x4F0000 spiffs_data build/spiffs.bin

          echo "=== Build artifacts ==="
          find build -name "*.bin" -type f | sort

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-firmware
          path: |
            build/FoloToy-AI-Passport.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/spiffs.bin
            build/flasher_args.json
          if-no-files-found: error

      - name: Create release zip
        run: |
          set -euo pipefail
          echo "=== 检查构建产物 ==="
          for f in "build/FoloToy-AI-Passport.bin" \
                   "build/bootloader/bootloader.bin" \
                   "build/partition_table/partition-table.bin" \
                   "build/spiffs.bin"; do
            if [ ! -f "$f" ]; then
              echo "错误: 缺少文件 $f"
              exit 1
            fi
            echo "  OK: $f"
          done

          mkdir -p release
          cp build/FoloToy-AI-Passport.bin release/firmware.bin
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          cp build/spiffs.bin release/
          cp FLASH_GUIDE.md release/ 2>/dev/null || true
          echo "刷写命令:" > release/刷写说明.txt
          echo "esptool.py -p COM3 -b 460800 --chip esp32c3 write_flash \\" >> release/刷写说明.txt
          echo "  0x0 bootloader.bin \\" >> release/刷写说明.txt
          echo "  0x8000 partition-table.bin \\" >> release/刷写说明.txt
          echo "  0x10000 firmware.bin \\" >> release/刷写说明.txt
          echo "  0x310000 spiffs.bin" >> release/刷写说明.txt

          echo "=== release 目录 ==="
          ls -lh release/

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-release
          path: release/
          if-no-files-found: error
