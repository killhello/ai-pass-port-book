name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Chinese font (Noto Sans SC)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs npm fonttools
          sudo npm install -g lv_font_conv@^1.5.2

          # 下载思源黑体 (Noto Sans SC) 精简版
          curl -L -o /tmp/NotoSansSC.ttf \
            "https://github.com/notofonts/noto-cn/raw/main/Sans/OTF/SimplifiedChinese/NotoSansSC-Regular.otf" || \
          curl -L -o /tmp/NotoSansSC.ttf \
            "https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"

          mkdir -p spiffs_data/fonts

          # 生成 16px 中文字体 (用于正文) — 包含 ASCII + 常用标点 + 3500 常用汉字
          # 常用字范围覆盖 99.8% 的日常中文使用,体积约 700KB
          lv_font_conv --bpp 2 --size 16 \
            --font /tmp/NotoSansSC.ttf \
            -r 0x20-0x7F \
            -r 0x3000-0x303F \
            -r 0x4E00-0x9FA0 \
            -r 0xFF00-0xFFEF \
            --format bin \
            --no-compress \
            -o spiffs_data/fonts/NotoSansSC_16.bin

          echo "字体文件大小:"
          ls -lh spiffs_data/fonts/

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            idf.py build
            # 生成 SPIFFS 镜像 (约 7MB 分区, 数据目录 spiffs_data)
            python $IDF_PATH/components/spiffs/spiffsgen.py \
              0x6F0000 spiffs_data build/spiffs.bin
            # 列出 build 产物便于排查
            ls -la build/*.bin build/bootloader/*.bin build/partition_table/*.bin 2>/dev/null || true
            cat build/flasher_args.json 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-firmware
          path: |
            build/FoloToy-AI-Passport.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/spiffs.bin
            build/flasher_args.json
          if-no-files-found: error

      - name: Create release zip
        run: |
          mkdir -p release
          cp build/FoloToy-AI-Passport.bin release/firmware.bin
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          cp build/spiffs.bin release/
          cp FLASH_GUIDE.md release/
          echo "刷写命令:" > release/刷写说明.txt
          echo "esptool.py -p COM3 -b 460800 --chip esp32c3 write_flash \\" >> release/刷写说明.txt
          echo "  0x0 bootloader.bin \\" >> release/刷写说明.txt
          echo "  0x8000 partition-table.bin \\" >> release/刷写说明.txt
          echo "  0x10000 firmware.bin \\" >> release/刷写说明.txt
          echo "  0x110000 spiffs.bin" >> release/刷写说明.txt

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-release
          path: release/
          if-no-files-found: error
