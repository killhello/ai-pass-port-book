name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            idf.py build
            # 生成 SPIFFS 镜像 (6MB 分区, 数据目录 spiffs_data)
            python $IDF_PATH/components/spiffs/spiffsgen.py \
              0x610000 spiffs_data build/spiffs.bin
            # 列出 build 产物便于排查
            ls -la build/*.bin build/bootloader/*.bin build/partition_table/*.bin 2>/dev/null || true
            cat build/flasher_args.json 2>/dev/null || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-firmware
          path: |
            build/FoloToy-AI-Passport.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/spiffs.bin
            build/flasher_args.json
          if-no-files-found: error

      - name: Create release zip
        run: |
          mkdir -p release
          cp build/FoloToy-AI-Passport.bin release/firmware.bin
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          cp build/spiffs.bin release/
          cp FLASH_GUIDE.md release/
          echo "刷写命令:" > release/刷写说明.txt
          echo "esptool.py -p COM3 -b 460800 --chip esp32c3 write_flash \\" >> release/刷写说明.txt
          echo "  0x0 bootloader.bin \\" >> release/刷写说明.txt
          echo "  0x8000 partition-table.bin \\" >> release/刷写说明.txt
          echo "  0x10000 firmware.bin \\" >> release/刷写说明.txt
          echo "  0x1F0000 spiffs.bin" >> release/刷写说明.txt

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-ebook-release
          path: release/
          if-no-files-found: error
